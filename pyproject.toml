[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "denominator-desk"
version = "0.2.0"
requires-python = ">=3.11"
description = "Explicit proportion definitions and group-composition comparisons"
license = "MIT"
authors = [{name = "walker512"}]
dependencies = []
[project.scripts]
denominator-desk = "denominator_desk.__main__:main"
[tool.setuptools.packages.find]
include = ["denominator_desk*"]
